name: Backend CI

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml", "pipeline/**", "db/**", "data/**"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml", "pipeline/**", "db/**", "data/**"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Instala las librerías necesarias de Python y corre la ingesta para crear el archivo SQLite
      - name: Generar base de datos SQLite
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl
          python ../pipeline/data_ingestion.py

      - run: npm ci
      - run: npm run lint
      - run: npm run test:e2e
      - run: npm run build
