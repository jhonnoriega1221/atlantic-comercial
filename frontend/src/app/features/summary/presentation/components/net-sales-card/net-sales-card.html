<div>
  <div
    class="bg-primary/20 absolute -top-6 -right-6 h-32 w-32 rounded-full blur-2xl transition-all"
  ></div>

  <div class="z-10 flex items-center justify-between">
    <span class="text-muted-foreground text-sm font-medium">Venta Neta Total</span>
    <div class="bg-primary/10 text-primary flex h-10 w-10 items-center justify-center rounded-full">
      <ng-icon name="lucideDollarSign" size="20" />
    </div>
  </div>

  <div class="z-10 my-4">
    <div class="text-3xl font-extrabold tracking-tight sm:text-4xl lg:text-5xl">
      {{ kpis().netSale | currency: "COP" : "symbol-narrow" : "1.0-0" }}
    </div>
    <div class="mt-3 flex items-center gap-2">
      @if (kpis().salesVariationMoM !== null) {
        <span
          class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-semibold"
          [ngClass]="
            kpis().salesVariationMoM! >= 0
              ? 'bg-green-500/10 text-green-600 dark:text-green-400'
              : 'bg-red-500/10 text-red-600 dark:text-red-400'
          "
        >
          <ng-icon
            [name]="kpis().salesVariationMoM! >= 0 ? 'lucideTrendingUp' : 'lucideTrendingDown'"
            size="14"
            class="mr-1"
          />
          {{ kpis().salesVariationMoM! / 100 | percent: "1.1-2" }} vs mes anterior
        </span>
      } @else {
        <span class="text-muted-foreground text-sm">—</span>
      }
    </div>
  </div>
</div>
