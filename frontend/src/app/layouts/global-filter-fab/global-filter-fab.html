<button
  hlmBtn
  type="button"
  size="icon"
  class="fixed right-4 bottom-[calc(5rem+env(safe-area-inset-bottom))] z-40 size-14 rounded-full shadow-lg sm:right-6 sm:bottom-6"
  [attr.aria-label]="
    store.activeCount() ? 'Filtros (' + store.activeCount() + ' activos)' : 'Filtros'
  "
  (click)="open()"
>
  <ng-icon name="lucideSlidersHorizontal" size="22" />
  @if (store.activeCount() > 0) {
    <span
      class="bg-background text-primary ring-primary absolute -top-1 -right-1 flex size-5 items-center justify-center rounded-full text-[11px] font-bold ring-2"
    >
      {{ store.activeCount() }}
    </span>
  }
</button>

<app-responsive-popup>
  <form [formGroup]="form" (ngSubmit)="apply()" class="space-y-4 p-4 sm:p-0">
    <div>
      <h2 class="text-lg font-semibold tracking-tight">Filtros</h2>
      <p class="text-muted-foreground text-sm">Se aplican a todas las vistas.</p>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <label class="space-y-1.5 text-sm font-medium">
        Desde
        <input hlmInput type="date" formControlName="startDate" class="w-full" />
      </label>
      <label class="space-y-1.5 text-sm font-medium">
        Hasta
        <input hlmInput type="date" formControlName="endDate" class="w-full" />
      </label>
    </div>
    <p class="text-muted-foreground -mt-2 text-xs">
      Los datos son mensuales: se usa el mes de la fecha elegida.
    </p>
    @if (rangeInvalid()) {
      <p class="text-destructive -mt-2 text-xs">
        La fecha inicial no puede ser posterior a la final.
      </p>
    }

    <label class="block space-y-1.5 text-sm font-medium">
      Sede
      <select hlmInput formControlName="location" class="w-full">
        <option value="">Todas las sedes</option>
        @for (loc of options().locations; track loc) {
          <option [value]="loc">{{ displayLocation(loc) }}</option>
        }
      </select>
    </label>

    <label class="block space-y-1.5 text-sm font-medium">
      Asesor
      <select hlmInput formControlName="advisor" class="w-full">
        <option value="">Todos los asesores</option>
        @for (a of advisorOptions(); track a.code) {
          <option [value]="a.code">{{ a.name }}</option>
        }
      </select>
    </label>

    <div class="flex flex-col-reverse gap-2 pt-2 sm:flex-row sm:justify-end">
      <button hlmBtn type="button" variant="outline" [disabled]="!canClear()" (click)="clear()">
        Limpiar filtros
      </button>
      <button hlmBtn type="submit" [disabled]="rangeInvalid()">Aplicar</button>
    </div>
  </form>
</app-responsive-popup>
